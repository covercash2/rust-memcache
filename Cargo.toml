[package]
name = "memcache"
version = "0.19.0"
authors = ["AN Long <aisk1988@gmail.com>"]
repository = "https://github.com/aisk/rust-memcache"
readme = "README.md"
license = "MIT"
description = "memcached client for rust"
keywords = ["memcache", "memcached", "driver", "cache", "database"]
edition = "2024"

[features]
default = ["tls"]
tls = ["openssl"]
rustls = ["dep:rustls", "dep:webpki-roots", "dep:rustls-pemfile"]

[dependencies]
byteorder = "1"
url = "^2.1"
rand = "0.10"
enum_dispatch = "0.3"
openssl = { version = "^0.10", optional = true }
r2d2 = "^0.8"
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "1.0", optional = true }
rustls-pemfile = { version = "2.0", optional = true }
